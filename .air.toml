# Air configuration for Reverse Tunnel project
# This enables hot reload during development - code changes trigger automatic rebuilds

# Working directory
# . represents the root of the project
root = "."

# Test directory
test_dir = ""

[build]
  # Just plain old shell command. You could use `make` as well.
  cmd = "go build -o ./bin/server.exe ./cmd/server"
  
  # Binary file yields from `cmd`.
  bin = "bin/server.exe"
  
  # Customize binary name
  # full_bin = ""
  
  # Watch these filename extensions.
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  
  # Ignore these filename extensions or directories.
  exclude_dir = ["bin", "dist", "vendor", "node_modules", ".git", ".idea", ".vscode", "dashboard"]
  
  # Watch these directories if you specified.
  include_dir = ["cmd", "internal", "cli"]
  
  # Watch these files.
  include_file = []
  
  # Exclude files.
  exclude_file = []
  
  # Exclude specific regular expressions.
  exclude_regex = ["_test\\.go"]
  
  # Exclude unchanged files.
  exclude_unchanged = false
  
  # Follow symlink for directories
  follow_symlink = false
  
  # This log file places in your tmp_dir.
  log = "errors.log"
  
  # Poll files for changes instead of using fsnotify.
  poll = false
  
  # Poll interval (defaults to the minimum interval of 500ms).
  poll_interval = 500 # ms
  
  # It's not necessary to trigger build each time file changes if it's too frequent.
  delay = 0 # ms
  
  # Stop running old binary when build errors occur.
  stop_on_error = false
  
  # Send Interrupt signal before killing process (windows does not support this feature)
  send_interrupt = false
  
  # Delay after sending Interrupt signal
  kill_delay = "0s"
  
  # Rerun binary or not
  rerun = true
  
  # Delay after each executions
  rerun_delay = 500
  
  # Add additional arguments when running binary (bin/full_bin).
  args_bin = []
  
  # Build command environment variables
  [build.env]
    CGO_ENABLED = "0"
    GOOS = ""
    GOARCH = ""

[color]
  # Customize each part's color. If no color found, use the raw app log.
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  # Show log time
  time = false
  
  # Only show main log (hide watcher, build, runner log)
  main_only = false

[misc]
  # Delete tmp directory on exit
  clean_on_exit = false
  
  # Enable live-reloading on the browser.
  reload_browser = false

# Custom commands for different development scenarios
# [build.pre_cmd]
#   # Commands to run before build (e.g., generate code, copy assets)
#   # Leave empty for now, can be used later for code generation

# [build.post_cmd]
#   # Commands to run after successful build
#   # Could be used to run tests or other checks
#   # Leave empty for now