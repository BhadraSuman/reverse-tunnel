name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Check Dashboard Build
        run: |
          cd dashboard
          npm ci
          npm run build

  deploy:
    name: Deploy to GCP Production VM
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST || '35.254.133.180' }}
          username: ${{ secrets.VM_USER || 'suman' }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ~/reverse-tunnel
            git pull origin main
            docker compose up -d --build
            docker compose ps
