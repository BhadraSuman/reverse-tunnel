# ─────────────────────────────────────────────
#  Reverse Tunnel — Docker Compose
#  Three services: server, dashboard, mongo
#  All on the internal "tunnel" bridge network.
#  Only Nginx touches the host network directly.
# ─────────────────────────────────────────────

services:
  # ── Go Tunnel Server (control plane + HTTP proxy) ──
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunnel-server
    restart: unless-stopped
    ports:
      - "3001:3001"   # WebSocket control plane (CLI connects here via Nginx)
      - "4000:4000"   # HTTP proxy (Nginx forwards tunneled traffic here)
      - "3002:3002"   # Internal API (dashboard reads active tunnels from here)
    environment:
      - PORT_CONTROL=3001
      - PORT_PROXY=4000
      - PORT_API=3002
      - MONGODB_URI=mongodb://mongo:27017/tunnel
      - DOMAIN=${DOMAIN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tunnel

  # ── Next.js Dashboard ──
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: tunnel-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"   # Nginx proxies dashboard.yourdomain.com here
    environment:
      - MONGODB_URI=mongodb://mongo:27017/tunnel
      - NEXTAUTH_URL=https://dashboard.${DOMAIN}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - TUNNEL_API_URL=http://server:3002  # internal server-to-server call
    env_file:
      - .env
    depends_on:
      - mongo
      - server
    networks:
      - tunnel

  # ── MongoDB ──
  mongo:
    image: mongo:7.0
    container_name: tunnel-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db          # persistent data — survives container restarts
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    # ports:
    #   - "127.0.0.1:27017:27017"   # commented out: native mongod already uses this port on host
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tunnel

networks:
  tunnel:
    driver: bridge

volumes:
  mongo_data:
    driver: local
