# ─────────────────────────────────────────────────────────────────────────────
#  Nginx — Reverse Tunnel Wildcard Configuration
#
#  This file handles three virtual hosts:
#    1. dashboard.yourdomain.com  → Next.js dashboard on :3000
#    2. tunnel.yourdomain.com     → Go WebSocket control server on :3001
#    3. *.yourdomain.com          → Go HTTP proxy server on :4000
#
#  Wildcard SSL cert covers *.yourdomain.com + yourdomain.com
#  Generated by Certbot with Cloudflare DNS plugin.
#
#  Replace "yourdomain.com" with your actual domain before deploying.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name *.yourdomain.com yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 1. Dashboard: dashboard.yourdomain.com ──────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name dashboard.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── 2. Control Plane: tunnel.yourdomain.com ────────────────────────────────
# CLI clients connect here via WebSocket (wss://tunnel.yourdomain.com)
server {
    listen 443 ssl;
    http2 on;
    server_name tunnel.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass             http://127.0.0.1:3001;
        proxy_http_version     1.1;

        # Critical: these two headers enable WebSocket upgrade
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";

        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Keep WebSocket connections alive for up to 1 hour
        # CLI clients maintain long-lived persistent connections
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}

# ── 3. Tunnel Traffic: *.yourdomain.com ────────────────────────────────────
# All tunneled HTTP traffic hits here (e.g., brave-wolf-42.yourdomain.com)
# IMPORTANT: This must come AFTER the more specific server blocks above.
# Nginx matches server_name in order, so dashboard.yourdomain.com and
# tunnel.yourdomain.com will NOT fall through to this wildcard block.
server {
    listen 443 ssl;
    http2 on;
    server_name *.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Limit request body size per tunnel request (default nginx is 1MB)
    # Increase if you expect large file uploads through tunnels
    client_max_body_size 10M;

    location / {
        proxy_pass             http://127.0.0.1:4000;
        proxy_http_version     1.1;

        # CRITICAL: Pass Host header through — the Go proxy server
        # extracts the subdomain from this to find the right tunnel
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # 35s timeout — slightly longer than the 30s Go-side timeout
        proxy_read_timeout     35s;
        proxy_connect_timeout  5s;
    }
}
